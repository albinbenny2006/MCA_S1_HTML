<html>
<head>
<title>JavaScript Output</title>
</head>
<body>
<h2>JavaScript Output Methods</h2>
<p id="output"></p>
<script>
//1.using innerHTML
document.getElementById("output").innerHTML="1.Output using innerHTML";

//2.using document.write()
document.write("<br>2.Output using document.write()");

//3.using alert()
window.alert("3.Output using alert()");

//4.using console.log()
console.log("4.output using console.log()");
</script>
</body>
</html>
